<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="764H-o1J75Z3FbjnsLGN7IPjf2_YpmcLgLt00wz5trY" />
  <title>Rhz news</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    id="siteFrame"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture" 
    allowfullscreen>
  </iframe>

  <script>
    const baseUrl = "https://stv-news.edgeone.dev";
    const iframe = document.getElementById("siteFrame");

    // 1. При загрузке открываем путь из URL родителя
    const currentPath = window.location.pathname + window.location.search + window.location.hash;
    iframe.src = baseUrl + currentPath;

    // 2. Слушаем сообщения от iframe, чтобы менять URL вверху
    window.addEventListener("message", (event) => {
      if (event.data && event.data.path) {
        window.history.pushState(null, "", event.data.path);
      }
    });
  </script>

</body>
</html>
